:root{color-scheme:dark;--pink:#ff36a6;--blue:#20c9ff;--yellow:#ffd52e;--purple:#9c55ff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#050509;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{min-height:100svh;overflow-x:hidden}
button{font:inherit}
.screen{min-height:100svh;width:100%;display:none;flex-direction:column;align-items:center;justify-content:flex-start;padding:calc(22px + env(safe-area-inset-top)) 14px calc(22px + env(safe-area-inset-bottom));}
.screen.active{display:flex}
#welcome{justify-content:center;overflow:hidden;position:relative;background:radial-gradient(ellipse at 50% 48%,#171326 0,#080811 48%,#020205 100%)}

#welcome:before{background:#ff1ca8;top:5%;left:-90px}

.welcome-title{z-index:1;text-align:center;font-size:clamp(25px,7vw,39px);line-height:1.13;font-weight:950;letter-spacing:.2px;text-shadow:0 3px 0 #64206f,0 0 22px #ff4fc2;margin:0 0 34px}
.welcome-sub{display:block;font-size:15px;font-weight:650;letter-spacing:1.6px;color:#d7d0ed;margin-top:10px;text-shadow:none}
 .gift-stack{z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,2.4svh,22px);width:min(90vw,340px);padding:14px 0 18px;perspective:none}

.gift:before{content:"";display:block;position:absolute;z-index:-1;left:50%;top:50%;transform:translate(-50%,-50%);width:88%;height:88%;border-radius:50%;background:radial-gradient(circle,rgba(255,226,150,.24) 0,rgba(180,135,255,.14) 45%,transparent 72%);filter:blur(13px);pointer-events:none}
.gift:after{content:"✧";display:block;position:absolute;right:4%;top:4%;color:#fff2c2;font-size:clamp(17px,5vw,23px);text-shadow:0 0 7px #fff,0 0 15px #ffe48a;pointer-events:none}
.gift .bow,.gift .shine{display:none}
.gift:active{filter:brightness(1.12) drop-shadow(0 0 10px rgba(255,235,170,.6)) drop-shadow(0 0 20px rgba(174,133,255,.32));transform:none}
.tap-hint{z-index:1;color:#fff;font-weight:800;font-size:16px;letter-spacing:.5px;margin-top:23px;text-shadow:0 0 12px #ff45bd;animation:pulse 1.5s ease-in-out infinite}
.spark{position:absolute;color:#fff;font-size:20px;opacity:.8;animation:twinkle 2s ease-in-out infinite}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -9px}}
@keyframes spin{0%,100%{rotate:-2deg}50%{rotate:2deg}}
@keyframes pulse{50%{opacity:.55;transform:scale(.97)}}
@keyframes twinkle{50%{opacity:.2;transform:scale(.65) rotate(35deg)}}
#puzzle{gap:10px;background:radial-gradient(ellipse at 50% 0,#17152b,#07070c 65%)}
.puzzle-heading{text-align:center;margin:0;font-size:clamp(21px,5.8vw,29px);font-weight:900;color:#fff;text-shadow:0 2px 12px #9c55ff}
.puzzle-instruction{text-align:center;color:#d4cfe2;font-size:13px;line-height:1.35;margin:0 0 2px;max-width:360px}
.board-wrap{width:min(72vw,300px);max-width:300px;flex:0 0 auto}
.board{width:100%;aspect-ratio:2/3;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(4,1fr);gap:4px;padding:5px;border:2px solid #8c79b5;border-radius:12px;background:#171321;box-shadow:0 0 20px #8552ff35}
.slot{border:2px dashed #7e718f;border-radius:6px;background:linear-gradient(135deg,#171521,#242033);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0}
.slot:before{content:attr(data-n);font-weight:800;color:#777085;font-size:clamp(13px,4vw,20px)}
.slot.filled{border:1px solid #ffffff55;background-size:200% 400%;background-repeat:no-repeat;box-shadow:inset 0 0 0 1px #fff5}
.slot.filled:before{display:none}
.slot.over{border-color:#ffe34d;background-color:#514326}
.tray-label{font-size:13px;font-weight:800;color:#bcb3d2;letter-spacing:1px;margin:0}
.tray{width:min(94vw,430px);display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:8px;border:1px solid #393149;border-radius:12px;background:#111019;min-height:calc((min(94vw,430px) - 46px)/4 * .75 + 16px)}
.tile{aspect-ratio:4/3;width:100%;border:2px solid #c5b4ed;border-radius:7px;background-repeat:no-repeat;background-size:200% 400%;box-shadow:0 3px 8px #0008;touch-action:none;position:relative;cursor:grab}
.tile.selected{outline:3px solid #ffe34d;outline-offset:2px;transform:scale(.96)}
.tile.dragging{opacity:.3}
.drag-ghost{position:fixed;z-index:1000;width:22vw;max-width:110px;aspect-ratio:4/3;border:3px solid #ffe34d;border-radius:8px;pointer-events:none;background-repeat:no-repeat;background-size:200% 400%;box-shadow:0 12px 30px #000b;transform:translate(-50%,-50%)}
.status{min-height:20px;text-align:center;color:#ffe58a;font-size:13px;font-weight:700;margin:0}
.progress{width:min(94vw,430px);height:7px;border-radius:20px;background:#282333;overflow:hidden}
.progress>span{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff42ad,#ffd33d,#22d2ff);transition:width .25s}
#done{justify-content:center;gap:14px;background:radial-gradient(ellipse at center,#20142d,#050509 75%);text-align:center}
.done-title{font-size:clamp(24px,6vw,34px);font-weight:950;margin:0;color:#ffe66b;text-shadow:0 0 16px #ff8b24}
.done-copy{margin:0;color:#e5dff1;font-size:14px}
.poster-frame{width:min(92vw,540px);height:min(70svh,760px);display:flex;align-items:center;justify-content:center;position:relative}
.poster{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;border-radius:8px;box-shadow:0 12px 45px #000b;cursor:zoom-in}
.action-btn{border:0;border-radius:999px;padding:12px 22px;font-weight:900;color:#17101e;background:linear-gradient(90deg,#ffe34f,#ff9e2f);box-shadow:0 5px 0 #9a4b18;cursor:pointer}
.action-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #9a4b18}
#zoom{position:fixed;inset:0;z-index:2000;background:#000f;display:none;align-items:center;justify-content:center;padding:10px}
#zoom.open{display:flex}
#zoom img{max-width:100%;max-height:100%;object-fit:contain;touch-action:pinch-zoom}
#zoom button{position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px;border:0;border-radius:50%;width:42px;height:42px;background:#fff;color:#111;font-size:25px;font-weight:900}
@media (max-height:700px) and (min-width:350px){#puzzle{gap:6px;padding-top:12px}.board-wrap{width:min(58vw,240px)}.tray{width:min(94vw,400px)}.puzzle-instruction{font-size:12px}}
@media (max-height:650px){.welcome-title{margin-bottom:12px}.gift-stack{gap:12px}.gift{width:clamp(92px,27vw,122px);height:clamp(104px,30vw,138px)}.tap-hint{margin-top:10px}}

<body>
<section id="welcome" class="screen active">
  <span class="spark" style="top:13%;left:13%">✦</span><span class="spark" style="top:25%;right:12%;animation-delay:-.7s">✧</span><span class="spark" style="bottom:18%;left:17%;animation-delay:-1.1s">✦</span><span class="spark" style="bottom:22%;right:15%;animation-delay:-.4s">✧</span>
  <h1 class="welcome-title">¡Tenemos una<br>sorpresa para ti!<span class="welcome-sub">ELIGE UNA CAJA Y DESCÚBRELA</span></h1>
  <div class="gift-stack" aria-label="Tres cajas sorpresa">
    <button class="gift" aria-label="Abrir caja rosa con cinta roja" data-gift="1"></button>
    <button class="gift" aria-label="Abrir caja verde con cinta amarilla" data-gift="2"></button>
    <button class="gift" aria-label="Abrir caja azul con cinta blanca" data-gift="3"></button>
  </div>
  <div class="tap-hint">👆 ¡TOCA UNA CAJA!</div>
</section>

<section id="puzzle" class="screen">
  <h1 class="puzzle-heading">¡Monta la invitación! 🧩</h1>
  <p class="puzzle-instruction">Arrastra cada pieza hasta su lugar.<br>También puedes tocar una pieza y después su hueco.</p>
  <div class="board-wrap"><div class="board" id="board" aria-label="Zona para montar el puzzle"></div></div>
  <p class="tray-label">PIEZAS DEL PUZZLE</p>
  <div class="tray" id="tray" aria-label="Bandeja de piezas"></div>
  <div class="progress"><span id="progressBar"></span></div>
  <p class="status" id="status" aria-live="polite">¡Tú puedes!</p>
</section>

<section id="done" class="screen">
  <h1 class="done-title">🎉 ¡LO HAS CONSEGUIDO! 🎉</h1>
  <p class="done-copy">¡Has descubierto tu invitación de cumpleaños!</p>
  <div class="poster-frame"><img class="poster" id="poster" alt="Invitación de cumpleaños de 7 años"></div>
  <button class="action-btn" id="zoomBtn">🔍 Ver invitación más grande</button>
</section>

<div id="zoom" role="dialog" aria-label="Invitación ampliada"><button id="closeZoom" aria-label="Cerrar">×</button><img id="zoomImage" alt="Invitación ampliada"></div>

const STORAGE_KEY = "cumple_puzzle_7_el_happy_land_v1";
const screens = ["welcome","puzzle","done"].map(id=>document.getElementById(id));
const board = document.getElementById("board");
const tray = document.getElementById("tray");
const statusEl = document.getElementById("status");
const progressBar = document.getElementById("progressBar");
let placed = Array(8).fill(false), selected = null, dragging = null, ghost = null, startPoint = null, moved = false;

function showScreen(id){screens.forEach(s=>s.classList.toggle("active",s.id===id));window.scrollTo(0,0)}
function completed(){try{return localStorage.getItem(STORAGE_KEY)==="yes"}catch(e){return false}}
function showDone(){document.getElementById("poster").src=INVITE;document.getElementById("zoomImage").src=INVITE;showScreen("done")}
function imagePosition(i){const col=i%2,row=Math.floor(i/2);return `${col*100}% ${row*(100/3)}%`}
function makePuzzle(){
  board.innerHTML="";tray.innerHTML="";placed=Array(8).fill(false);selected=null;
  for(let i=0;i<8;i++){
    const slot=document.createElement("div");slot.className="slot";slot.dataset.index=i;slot.dataset.n=i+1;slot.setAttribute("role","button");slot.setAttribute("aria-label",`Hueco ${i+1}`);
    slot.addEventListener("click",()=>{if(selected!==null) place(selected,i)});
    slot.addEventListener("pointerenter",()=>slot.classList.add("over"));
    slot.addEventListener("pointerleave",()=>slot.classList.remove("over"));
    board.appendChild(slot);
  }
  const order=[0,1,2,3,4,5,6,7];
  for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
  // Evita que el puzzle aparezca resuelto por casualidad.
  if(order.every((v,i)=>v===i))[order[0],order[1]]=[order[1],order[0]];
  order.forEach(index=>tray.appendChild(createTile(index)));
  updateProgress();
}
function createTile(index){
  const tile=document.createElement("div");tile.className="tile";tile.dataset.index=index;tile.setAttribute("role","button");tile.setAttribute("aria-label",`Pieza ${index+1}`);
  tile.style.backgroundImage=`url("${INVITE}")`;tile.style.backgroundPosition=imagePosition(index);
  tile.addEventListener("click",()=>{if(moved){moved=false;return} selectTile(index)});
  tile.addEventListener("pointerdown",e=>beginDrag(e,index,tile));
  return tile;
}
function selectTile(index){
  selected=selected===index?null:index;
  tray.querySelectorAll(".tile").forEach(t=>t.classList.toggle("selected",Number(t.dataset.index)===selected));
  statusEl.textContent=selected===null?"Elige una pieza y su hueco.":"Ahora toca el hueco donde crees que va.";
}
function place(index,slotIndex){
  if(placed[index])return;
  const tile=tray.querySelector(`.tile[data-index="${index}"]`);
  if(index===slotIndex){
    placed[index]=true;selected=null;
    const slot=board.querySelector(`.slot[data-index="${slotIndex}"]`);
    slot.classList.remove("over");slot.classList.add("filled");
    slot.style.backgroundImage=`url("${INVITE}")`;slot.style.backgroundPosition=imagePosition(index);
    if(tile)tile.remove();
    statusEl.textContent=["¡Muy bien! ⭐","¡Genial! 🎈","¡Esa es! 🌟","¡Perfecto! 💖"][Math.floor(Math.random()*4)];
    updateProgress();
    if(placed.every(Boolean)){
      try{localStorage.setItem(STORAGE_KEY,"yes")}catch(e){}
      setTimeout(showDone,650);
    }
  }else{
    selected=null;tray.querySelectorAll(".tile").forEach(t=>t.classList.remove("selected"));
    statusEl.textContent="¡Uy! Esa pieza no va ahí. ¡Prueba otra vez! 😊";
    if(tile){tile.animate([{transform:"translateX(0)"},{transform:"translateX(-5px)"},{transform:"translateX(5px)"},{transform:"translateX(0)"}],{duration:220})}
  }
}
function updateProgress(){const n=placed.filter(Boolean).length;progressBar.style.width=(n/8*100)+"%"}
function beginDrag(e,index,tile){
  if(e.button!==undefined&&e.button!==0)return;
  e.preventDefault();selected=index;moved=false;startPoint={x:e.clientX,y:e.clientY};dragging={index,tile,pointerId:e.pointerId};
  try{tile.setPointerCapture(e.pointerId)}catch(err){}
  const onMove=ev=>{
    if(!dragging||ev.pointerId!==dragging.pointerId)return;
    const dx=ev.clientX-startPoint.x,dy=ev.clientY-startPoint.y;
    if(!ghost&&Math.hypot(dx,dy)>7){
      moved=true;tile.classList.add("dragging");ghost=document.createElement("div");ghost.className="drag-ghost";ghost.style.backgroundImage=`url("${INVITE}")`;ghost.style.backgroundPosition=imagePosition(index);document.body.appendChild(ghost);
    }
    if(ghost){ghost.style.left=ev.clientX+"px";ghost.style.top=ev.clientY+"px";const el=document.elementFromPoint(ev.clientX,ev.clientY)?.closest(".slot");board.querySelectorAll(".slot").forEach(s=>s.classList.toggle("over",s===el))}
  };
  const onUp=ev=>{
    if(!dragging||ev.pointerId!==dragging.pointerId)return;
    if(ghost){
      const target=document.elementFromPoint(ev.clientX,ev.clientY)?.closest(".slot");
      if(target)place(index,Number(target.dataset.index));
      ghost.remove();ghost=null;tile.classList.remove("dragging");
      board.querySelectorAll(".slot").forEach(s=>s.classList.remove("over"));
    }
    dragging=null;window.removeEventListener("pointermove",onMove);window.removeEventListener("pointerup",onUp);window.removeEventListener("pointercancel",onUp);
    setTimeout(()=>{moved=false},80);
  };
  window.addEventListener("pointermove",onMove,{passive:false});window.addEventListener("pointerup",onUp);window.addEventListener("pointercancel",onUp);
}
document.querySelectorAll(".gift").forEach(g=>g.addEventListener("click",()=>{if(completed()){showDone()}else{makePuzzle();showScreen("puzzle")}}));
document.getElementById("zoomBtn").addEventListener("click",()=>document.getElementById("zoom").classList.add("open"));
document.getElementById("closeZoom").addEventListener("click",()=>document.getElementById("zoom").classList.remove("open"));
document.getElementById("zoom").addEventListener("click",e=>{if(e.target.id==="zoom")e.currentTarget.classList.remove("open")});
if(completed())showDone();
</script>
